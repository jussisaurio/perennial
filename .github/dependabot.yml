# Weekly dependency updates, grouped so they arrive as a few PRs, not dozens.
version: 2
updates:
  # Bun workspaces (web, server, scripts) share one bun.lock at the root.
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    # Only minor and patch updates are grouped, so the group stays green and can merge on its own.
    # Majors, and packages where any bump can change behaviour (Effect is pinned; ts-fsrs schedules
    # learners' reviews), each arrive as their own PR.
    groups:
      dependencies:
        patterns: ["*"]
        exclude-patterns: ["effect", "@effect/*", "ts-fsrs"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
