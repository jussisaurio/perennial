# Weekly dependency updates, grouped so they arrive as a few PRs, not dozens.
version: 2
updates:
  # Bun workspaces (web, server, scripts) share one bun.lock at the root.
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    groups: { dependencies: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
