name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled: the deck-big-change label approves retiring >5% of a deck's words.
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start Postgres + Electric (in the background)
        # Pulling and starting the images takes ~15 s; the next steps run meanwhile.
        # `up -d` alone still blocks during the pull, so it runs as a background process.
        run: nohup docker compose up -d > "$RUNNER_TEMP/compose.log" 2>&1 &
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install (all workspaces)
        run: bun install --frozen-lockfile

      - name: Typecheck (web)
        working-directory: web
        run: bun run typecheck
      - name: Typecheck (server)
        working-directory: server
        run: bun run typecheck
      - name: Lint (web)
        working-directory: web
        run: bun run lint
      - name: Unit tests (web)
        working-directory: web
        run: bun run test
      - name: Wait for Postgres + Electric
        # Started early (above), so the image pulls ran during the other setup. Fail here, not later in the tests.
        # Electric answers 202 "starting" first, and "active" only once its Postgres connection is up.
        run: |
          for i in $(seq 1 90); do curl -sf localhost:30009/v1/health | grep -q '"active"' && exit 0; sleep 1; done
          echo "Postgres + Electric were not ready after 90 s"; cat "$RUNNER_TEMP/compose.log"; docker compose logs; exit 1
      - name: Server tests (against Postgres + Electric)
        working-directory: server
        run: bun test
      - name: Build (web)
        working-directory: web
        run: bunx vite build


  security:
    name: Dependency audit and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Known vulnerabilities in what we ship (dev tools are updated by Dependabot).
      - name: Audit dependencies
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=high
      # Semgrep OSS (CodeQL needs Advanced Security on a private repo).
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep semgrep scan --error --metrics=off \
            --config p/typescript --config p/javascript --config p/secrets \
            --exclude node_modules --exclude dist --exclude decks

  decks:
    name: Decks (schema, up to date, compatibility, replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # check.ts compares against origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install (all workspaces)
        run: bun install --frozen-lockfile

      - name: Typecheck (scripts)
        working-directory: scripts
        run: bun run typecheck
      - name: Deck tests (build, schema, replay)
        run: bun test scripts/deck web/src/deck
      # Prints the diff report (added / edited / retired). Fails on broken
      # invariants, a stale deck.json, or more than 5% of words retired.
      - name: Audit decks (duplicates, rare words, order)
        run: bun scripts/deck/audit.ts
      - name: Check decks against main (approvals, ledgers, compatibility)
        run: bun scripts/deck/check.ts --base origin/main
        env:
          DECK_ALLOW_BIG_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'deck-big-change') && '1' || '' }}

  e2e:
    name: End-to-end (${{ matrix.label }})
    runs-on: ubuntu-latest
    # The tests are independent, so the suite splits across runners. WebKit runs
    # alone: its system packages are slow to install, and only one spec uses it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "Chromium 1/4", browser: chromium, args: "--project=desktop --project=phone --shard=1/4" }
          - { label: "Chromium 2/4", browser: chromium, args: "--project=desktop --project=phone --shard=2/4" }
          - { label: "Chromium 3/4", browser: chromium, args: "--project=desktop --project=phone --shard=3/4" }
          - { label: "Chromium 4/4", browser: chromium, args: "--project=desktop --project=phone --shard=4/4" }
          - { label: "iPhone, WebKit", browser: webkit, args: "--project=iphone" }
    steps:
      - uses: actions/checkout@v7
      - name: Start Postgres + Electric (in the background)
        # Pulling and starting the images takes ~15 s; the next steps run meanwhile.
        # `up -d` alone still blocks during the pull, so it runs as a background process.
        run: nohup docker compose up -d > "$RUNNER_TEMP/compose.log" 2>&1 &
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install (all workspaces)
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('bun.lock') }}
      # Two steps, so the log shows which part is slow: the system packages (apt) are not cached.
      - name: Install browser system packages
        working-directory: web
        run: bunx playwright install-deps ${{ matrix.browser }}
      - name: Install Playwright browsers
        working-directory: web
        run: bunx playwright install ${{ matrix.browser }}
      # Vite pre-bundles dependencies on the first page load; keep that work between runs.
      - name: Cache Vite dependencies
        uses: actions/cache@v6
        with:
          path: web/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('bun.lock', 'web/vite.config.ts') }}

      - name: Wait for Postgres + Electric
        # Started early (above), so the image pulls ran during the other setup. Fail here, not later in the tests.
        # Electric answers 202 "starting" first, and "active" only once its Postgres connection is up.
        run: |
          for i in $(seq 1 90); do curl -sf localhost:30009/v1/health | grep -q '"active"' && exit 0; sleep 1; done
          echo "Postgres + Electric were not ready after 90 s"; cat "$RUNNER_TEMP/compose.log"; docker compose logs; exit 1
      - name: Run e2e
        working-directory: web
        run: bunx playwright test ${{ matrix.args }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
