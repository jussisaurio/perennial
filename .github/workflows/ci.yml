name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled: the deck-big-change label approves retiring >5% of a deck's words.
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          postgres: "true"
      - name: Check (typecheck, lint, knip, unit tests, deck tests, server tests)
        # The same command agents run before a merge (docs/agents.md, "Checks").
        run: bun run check
      - name: Build (web)
        working-directory: web
        run: bunx vite build


  security:
    name: Dependency audit and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Known vulnerabilities in what we ship (dev tools are updated by Dependabot).
      - name: Audit dependencies
        run: bun audit --audit-level=high
      # Semgrep OSS (CodeQL needs Advanced Security on a private repo).
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep semgrep scan --error --metrics=off \
            --config p/typescript --config p/javascript --config p/secrets \
            --exclude node_modules --exclude dist --exclude decks

  decks:
    name: Decks (schema, up to date, compatibility, replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # check.ts compares against origin/main
      - uses: ./.github/actions/setup

      # The deck tests and the scripts typecheck run in the checks job (`bun run check`).
      # Prints the diff report (added / edited / retired). Fails on broken
      # invariants, a stale deck.json, or more than 5% of words retired.
      - name: Audit decks (duplicates, rare words, order)
        run: bun scripts/deck/audit.ts
      - name: Check decks against main (approvals, ledgers, compatibility)
        run: bun scripts/deck/check.ts --base origin/main
        env:
          DECK_ALLOW_BIG_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'deck-big-change') && '1' || '' }}

  e2e:
    name: End-to-end (${{ matrix.label }})
    runs-on: ubuntu-latest
    # The tests are independent, so the suite splits across runners. WebKit runs
    # alone: its system packages are slow to install, and only one spec uses it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "Chromium 1/8", browser: chromium, args: "--project=desktop --project=phone --shard=1/8" }
          - { label: "Chromium 2/8", browser: chromium, args: "--project=desktop --project=phone --shard=2/8" }
          - { label: "Chromium 3/8", browser: chromium, args: "--project=desktop --project=phone --shard=3/8" }
          - { label: "Chromium 4/8", browser: chromium, args: "--project=desktop --project=phone --shard=4/8" }
          - { label: "Chromium 5/8", browser: chromium, args: "--project=desktop --project=phone --shard=5/8" }
          - { label: "Chromium 6/8", browser: chromium, args: "--project=desktop --project=phone --shard=6/8" }
          - { label: "Chromium 7/8", browser: chromium, args: "--project=desktop --project=phone --shard=7/8" }
          - { label: "Chromium 8/8", browser: chromium, args: "--project=desktop --project=phone --shard=8/8" }
          - { label: "iPhone, WebKit", browser: webkit, args: "--project=iphone" }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          postgres: "true"
          browser: ${{ matrix.browser }}
      - name: Run e2e
        working-directory: web
        run: bunx playwright test ${{ matrix.args }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
