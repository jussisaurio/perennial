name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled: the deck-big-change label approves retiring >5% of a deck's words.
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install (all workspaces)
        run: bun install --frozen-lockfile

      - name: Typecheck (web)
        working-directory: web
        run: bun run typecheck
      - name: Typecheck (server)
        working-directory: server
        run: bun run typecheck
      - name: Lint (web)
        working-directory: web
        run: bun run lint
      - name: Unit tests (web)
        working-directory: web
        run: bun run test
      - name: Start Postgres + Electric
        run: |
          docker compose up -d --wait
          for i in $(seq 1 60); do curl -sf localhost:30009/v1/health && break; sleep 1; done
      - name: Server tests (against Postgres + Electric)
        working-directory: server
        run: bun test
      - name: Build (web)
        working-directory: web
        run: bunx vite build


  security:
    name: Dependency audit and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Known vulnerabilities in what we ship (dev tools are updated by Dependabot).
      - name: Audit dependencies
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=high
      # Semgrep OSS (CodeQL needs Advanced Security on a private repo).
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep semgrep scan --error --metrics=off \
            --config p/typescript --config p/javascript --config p/secrets \
            --exclude node_modules --exclude dist --exclude decks

  decks:
    name: Decks (schema, up to date, compatibility, replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # check.ts compares against origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install (all workspaces)
        run: bun install --frozen-lockfile

      - name: Typecheck (scripts)
        working-directory: scripts
        run: bun run typecheck
      - name: Deck tests (build, schema, replay)
        run: bun test scripts/deck web/src/deck
      # Prints the diff report (added / edited / retired). Fails on broken
      # invariants, a stale deck.json, or more than 5% of words retired.
      - name: Audit decks (duplicates, rare words, order)
        run: bun scripts/deck/audit.ts
      - name: Check decks against main (approvals, ledgers, compatibility)
        run: bun scripts/deck/check.ts --base origin/main
        env:
          DECK_ALLOW_BIG_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'deck-big-change') && '1' || '' }}

  e2e:
    name: End-to-end (Playwright ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # The tests are independent, so the suite splits across runners.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install (all workspaces)
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright browsers
        working-directory: web
        run: bunx playwright install --with-deps chromium webkit

      - name: Start Postgres + Electric
        run: |
          docker compose up -d --wait
          for i in $(seq 1 60); do curl -sf localhost:30009/v1/health && break; sleep 1; done
      - name: Run e2e
        working-directory: web
        run: bunx playwright test --shard=${{ matrix.shard }}/2

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
