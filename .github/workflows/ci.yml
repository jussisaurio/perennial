name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled: the deck-big-change label approves retiring >5% of a deck's words.
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install (web)
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install (server)
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Typecheck (web)
        working-directory: web
        run: bun run typecheck
      - name: Typecheck (server)
        working-directory: server
        run: bun run typecheck
      - name: Lint (web)
        working-directory: web
        run: bun run lint
      - name: Unit tests (web)
        working-directory: web
        run: bun run test
      - name: Start Postgres + Electric
        run: |
          docker compose up -d --wait
          for i in $(seq 1 60); do curl -sf localhost:30009/v1/health && break; sleep 1; done
      - name: Server tests (against Postgres + Electric)
        working-directory: server
        run: bun test
      - name: Build (web)
        working-directory: web
        run: bunx vite build

  decks:
    name: Decks (schema, up to date, compatibility, replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check.ts compares against origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install (web, for the deck schema)
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install (scripts)
        working-directory: scripts
        run: bun install --frozen-lockfile

      - name: Typecheck (scripts)
        working-directory: scripts
        run: bun run typecheck
      - name: Deck tests (build, schema, replay)
        run: bun test scripts/deck web/src/deck
      # Prints the diff report (added / edited / retired). Fails on broken
      # invariants, a stale deck.json, or more than 5% of words retired.
      - name: Check decks against main
        run: bun scripts/deck/check.ts --base origin/main
        env:
          DECK_ALLOW_BIG_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'deck-big-change') && '1' || '' }}

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (web)
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install (server)
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - name: Install Playwright browsers
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Start Postgres + Electric
        run: |
          docker compose up -d --wait
          for i in $(seq 1 60); do curl -sf localhost:30009/v1/health && break; sleep 1; done
      - name: Run e2e
        working-directory: web
        run: bunx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
