# One Claude Code agent takes one issue and works it to a merged PR (docs/autonomy.md).
# It is off until the owner sets the repository variable AUTORUN_ENABLED to "true".
# The logic is in scripts/autorun/.
name: Autorun

# Only the clock and the owner's hand start a run. Never issue, comment or pull request events:
# anyone can write those in a public repo, and their text must not start or steer an agent.
on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

# One run at a time, so two agents never take the same issue.
concurrency:
  group: autorun
  cancel-in-progress: false

# Each job asks for its own.
permissions: {}

# The limits, in one place (docs/autonomy.md, "Limits").
env:
  AUTORUN_RUNS_PER_DAY: "4"
  AUTORUN_MAX_TURNS: "250"
  AUTORUN_MAX_BUDGET_USD: "15"

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      issue: ${{ steps.pick.outputs.issue }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Pick an issue, or say why not
        id: pick
        run: bun scripts/autorun/run.ts pick
        env:
          GH_TOKEN: ${{ github.token }}
          AUTORUN_ENABLED: ${{ vars.AUTORUN_ENABLED }}
          # Only whether the secrets are set ("true" or "false"), never their values.
          AUTORUN_SECRETS: ${{ secrets.AUTORUN_GH_TOKEN != '' && (secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '') }}

  work:
    needs: pick
    if: needs.pick.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # The workflow's own token only claims the issue and writes the runner's comments (contents: read
    # is for the setup's actions). The agent pushes, opens PRs and merges with AUTORUN_GH_TOKEN, which
    # can't change workflows, secrets, variables or the rules on main (docs/autonomy.md).
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AUTORUN_GH_TOKEN }}
          # The agent rebases onto main and reads its history.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          postgres: "true"
          browser: chromium
      - name: Claim the issue and write the prompt
        id: start
        run: bun scripts/autorun/run.ts start "$ISSUE"
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.pick.outputs.issue }}
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.316
      - name: Run the agent
        id: agent
        # Below the job's limit, so that the report below still runs after a timeout.
        timeout-minutes: 120
        run: bun scripts/autorun/run.ts agent
        env:
          GH_TOKEN: ${{ secrets.AUTORUN_GH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude Code's own credential is taken out of the environment of the agent's commands.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          DISABLE_AUTOUPDATER: "1"
          # scripts/merge.sh waits for the required checks in the foreground (a few minutes).
          BASH_DEFAULT_TIMEOUT_MS: "600000"
          BASH_MAX_TIMEOUT_MS: "1800000"
      - name: Report on the issue and remove the claim
        if: always() && steps.start.outcome == 'success'
        run: bun scripts/autorun/run.ts finish "$ISSUE"
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.pick.outputs.issue }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
