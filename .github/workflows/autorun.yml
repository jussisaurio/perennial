# Claude Code agents, each on its own issue, work the issues to merged PRs (docs/autonomy.md).
# It is off until the owner sets the repository variable AUTORUN_ENABLED to "true".
# The logic is in scripts/autorun/.
name: Autorun

# Only the clock and the owner's hand start a run. Never issue, comment or pull request events:
# anyone can write those in a public repo, and their text must not start or steer an agent.
on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

# One run at a time, so that no more than AUTORUN_AGENTS_PER_RUN agents work at once.
concurrency:
  group: autorun
  cancel-in-progress: false

# Each job asks for its own.
permissions: {}

# The limits, in one place (docs/autonomy.md, "Limits"). scripts/autorun/run.ts reads them from this file.
env:
  AUTORUN_AGENTS_PER_RUN: "3"
  AUTORUN_AGENTS_PER_DAY: "12"
  AUTORUN_MAX_TURNS: "250"
  AUTORUN_MAX_BUDGET_USD: "15"

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The workflow's own token claims the issues: a comment on each.
    permissions:
      contents: read
      issues: write
    outputs:
      issues: ${{ steps.pick.outputs.issues }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Pick and claim the issues, or say why not
        id: pick
        run: bun scripts/autorun/run.ts pick
        env:
          GH_TOKEN: ${{ github.token }}
          AUTORUN_ENABLED: ${{ vars.AUTORUN_ENABLED }}
          # Only whether the secrets are set ("true" or "false"), never their values.
          AUTORUN_SECRETS: ${{ secrets.AUTORUN_GH_TOKEN != '' && (secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '') }}

  work:
    needs: pick
    # The pick always writes a list; an empty one means no agent starts.
    if: needs.pick.outputs.issues != '[]'
    name: "Agent on #${{ matrix.issue }}"
    strategy:
      # Each agent works alone: one that fails does not stop the others.
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.pick.outputs.issues) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # The workflow's own token only writes the runner's comments (contents: read is for the setup's
    # actions). The agent pushes, opens PRs and merges with AUTORUN_GH_TOKEN, which can't change
    # workflows, secrets, variables or the rules on main (docs/autonomy.md).
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AUTORUN_GH_TOKEN }}
          # The agent rebases onto main and reads its history.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          postgres: "true"
          browser: chromium
      - name: Write the prompt
        run: bun scripts/autorun/run.ts prompt "$ISSUE"
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ matrix.issue }}
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.316
      - name: Run the agent
        id: agent
        # Below the job's limit, so that the report below still runs after a timeout.
        timeout-minutes: 120
        run: bun scripts/autorun/run.ts agent
        env:
          GH_TOKEN: ${{ secrets.AUTORUN_GH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Read-only, for `bun run real-use` (docs/real-use.md). Empty until the owner adds the secret.
          REAL_USE_DATABASE_URL: ${{ secrets.REAL_USE_DATABASE_URL }}
          # Claude Code's own credential is taken out of the environment of the agent's commands.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          DISABLE_AUTOUPDATER: "1"
          # scripts/merge.sh waits for the required checks in the foreground (a few minutes).
          BASH_DEFAULT_TIMEOUT_MS: "600000"
          BASH_MAX_TIMEOUT_MS: "1800000"
      # The pick claimed the issue, so this runs whatever happened above. If it can't run (the job
      # died), the claim ends by itself after CLAIM_HOURS (scripts/autorun/lib.ts).
      - name: Report on the issue and end the claim
        if: always()
        run: bun scripts/autorun/run.ts finish "$ISSUE"
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ matrix.issue }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
