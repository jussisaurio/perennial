# The weekly upkeep, with no person (CLAUDE.md, "Every week"): it opens "Cleanup sweep <date>" and
# "Friction retro <date>" as `ready` issues that agents take, ends dead claims, and takes `ready` off
# issues whose files are gone. The logic is in scripts/upkeep/.
name: Upkeep

# Only the clock and the owner's hand start it. Never issue, comment or pull request events:
# anyone can write those in a public repo.
on:
  schedule:
    # Mondays, 05:17 UTC.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Change nothing, only print what it would do
        type: boolean
        default: false

# It only writes issues: it opens them, comments, and removes `ready`. Contents is for the checkout.
permissions:
  issues: write
  contents: read

# One run at a time, so two runs can never both open the week's issues.
concurrency:
  group: upkeep
  cancel-in-progress: false

jobs:
  upkeep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The whole history, for the files that were deleted since an issue named them.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Open the week's issues and clean up
        run: bun scripts/upkeep/run.ts ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
