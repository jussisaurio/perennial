# Local Postgres + Electric for development, tests and CI.
#   docker compose up -d        then: cd server && bun run migrate && bun dev
services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment:
      POSTGRES_USER: perennial
      POSTGRES_PASSWORD: perennial
      POSTGRES_DB: perennial
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perennial"]
      interval: 2s
      timeout: 3s
      retries: 30
  electric:
    image: electricsql/electric:1.8.1
    environment:
      DATABASE_URL: postgresql://perennial:perennial@postgres:5432/perennial?sslmode=disable
      ELECTRIC_INSECURE: "true"
    ports: ["30009:3000"]
    depends_on:
      postgres:
        condition: service_healthy
