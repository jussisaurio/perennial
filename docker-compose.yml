# Local Postgres for development, tests and CI.
#   docker compose up -d        then: cd server && bun run migrate && bun dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: perennial
      POSTGRES_PASSWORD: perennial
      POSTGRES_DB: perennial
    # Below 32768: Linux hands out 32768-60999 as source ports for outgoing
    # connections, and one of those once took our port on a CI runner.
    ports: ["25432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perennial"]
      interval: 2s
      timeout: 3s
      retries: 30
